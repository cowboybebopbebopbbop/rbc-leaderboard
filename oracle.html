<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<title>Оракул — Кто точнее</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== система ===== */
  :root{
    --ink:#07080B; --ink2:#0C0E13; --ink3:#12151C;
    --hair:rgba(244,241,232,.08); --hair2:rgba(244,241,232,.14);
    --fg:#F2EFE6; --mut:#8B93A7; --dim:#565D6E;
    --amber:#FFB020; --amber2:#C77E0A; --green:#2CE08B; --red:#FF5252;
    --f-disp:'Unbounded',ui-sans-serif,system-ui,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-back:cubic-bezier(.34,1.56,.64,1);
    --ease-inout:cubic-bezier(.65,0,.35,1);
    --t1:.14s; --t2:.26s; --t3:.52s;
    color-scheme:dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--ink); color:var(--fg); font-family:var(--f-mono); font-size:15px}
  body{min-height:100dvh; overscroll-behavior-y:none; line-height:1.45}
  #app{max-width:560px; margin:0 auto; padding:0 16px calc(92px + env(safe-area-inset-bottom))}
  a{color:inherit; text-decoration:none}
  button{font-family:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer}
  svg.px{display:inline-block; vertical-align:-3px; width:1em; height:1em; fill:currentColor}
  img.spr{image-rendering:pixelated; display:block}
  img.ai{display:block}

  h1,h2,.disp{font-family:var(--f-disp)}
  .k{font-family:var(--f-mono); font-weight:500; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
  .hairline{height:1px; background:var(--hair); border:none; margin:0}

  /* ===== шапка ===== */
  header{display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 0 14px}
  .logo{display:flex; align-items:center; gap:9px; font-weight:900; font-size:17px; letter-spacing:.22em}
  .logo svg{width:20px; height:20px; color:var(--amber); filter:drop-shadow(0 0 6px rgba(255,176,32,.55))}
  .logo small{display:block; font-family:var(--f-mono); font-weight:500; font-size:10px;
    letter-spacing:.24em; color:var(--dim); margin-top:4px; text-transform:uppercase}
  #sndbtn{width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    color:var(--dim); transition:color var(--t2) var(--ease-out), transform var(--t1)}
  #sndbtn.on{color:var(--amber)}
  #sndbtn:active{transform:scale(.88)}
  #sndbtn svg{width:18px; height:18px}

  /* ===== секции/переходы ===== */
  main section{display:none}
  main section.on{display:block}
  main section>:first-child{margin-top:14px}
  @keyframes enter{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  .stag>*{animation:enter var(--t2) var(--ease-out) both; animation-delay:calc(var(--i,0)*42ms)}
  .stagitem{animation:enter .3s var(--ease-out) both; animation-delay:calc(var(--i,0)*45ms)}

  .sect{margin:20px 0 8px}
  .sect h2{font-size:14px; font-weight:700; letter-spacing:.26em; margin:0; color:var(--fg)}
  .sect .k{margin-top:3px}

  /* ===== эфир ===== */
  .ticker{display:flex; align-items:baseline; gap:10px; margin-top:16px}
  .ticker .price{font-family:var(--f-disp); font-weight:900; font-size:38px; letter-spacing:.01em}
  .ticker .asset{font-size:12.5px; color:var(--mut); letter-spacing:.12em}
  .statusline{margin-top:6px; font-size:12px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase}
  .statusline b{color:var(--amber); font-weight:600}
  .bigstate{font-family:var(--f-disp); font-weight:700; font-size:17px; line-height:1.4; margin:18px 0 2px}
  .bigstate.win{color:var(--green)} .bigstate.warn{color:var(--amber)}
  .ladderwrap{position:relative; margin:14px -6px 0}
  canvas.ladder{display:block; width:100%; touch-action:manipulation}
  .confetti{position:absolute; inset:0; pointer-events:none}
  .undernote{margin-top:10px; font-size:12.5px; color:var(--mut)}
  .undernote b{color:var(--fg); font-weight:600}
  .marknote{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12.5px; color:var(--amber)}
  .marknote svg{width:14px;height:14px; flex:none}
  .marknote small{color:var(--dim); margin-left:auto; font-size:11px; letter-spacing:.06em}

  .steps{margin-top:18px}
  .step{display:flex; align-items:center; gap:12px; padding:11px 0}
  .step .num{font-family:var(--f-disp); font-weight:900; font-size:15px; color:var(--dim); width:16px; flex:none}
  .step .txt{font-size:14px; color:var(--mut)}
  .cta{display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
    background:var(--amber); color:#140D02; font-family:var(--f-disp); font-weight:700; font-size:15px;
    letter-spacing:.06em; padding:15px; border-radius:10px;
    transition:transform var(--t1) var(--ease-out), box-shadow var(--t2);
    box-shadow:0 4px 24px rgba(255,176,32,.25)}
  .cta:active{transform:scale(.97)}
  .cta svg{width:16px; height:16px}
  .cta.ghost{background:none; color:var(--mut); box-shadow:none; border:1px solid var(--hair2); font-weight:500}

  /* ===== табы ===== */
  nav#tabs{position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:rgba(7,8,11,.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--hair); padding-bottom:env(safe-area-inset-bottom)}
  nav#tabs .inner{max-width:520px; margin:0 auto; display:flex}
  nav#tabs button{flex:1; padding:10px 0 9px; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--dim); font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
    transition:color var(--t2) var(--ease-out); position:relative}
  nav#tabs button svg, nav#tabs button img{width:21px; height:21px; transition:transform var(--t2) var(--ease-back)}
  nav#tabs button.on{color:var(--amber)}
  nav#tabs button.on svg, nav#tabs button.on img{transform:translateY(-2px) scale(1.1)}
  nav#tabs .dot{position:absolute; top:6px; right:calc(50% - 16px); width:5px; height:5px; border-radius:99px; background:var(--amber)}

  /* ===== финиши ===== */
  .frow{display:flex; align-items:center; gap:13px; padding:14px 0; border-bottom:1px solid var(--hair); cursor:pointer}
  .frow:last-child{border-bottom:none}
  .frow img{width:42px; height:42px; flex:none}
  .frow .t1{font-size:14px; font-weight:600; letter-spacing:.02em}
  .frow .t2{font-size:11.5px; color:var(--dim); margin-top:3px; letter-spacing:.08em; text-transform:uppercase}
  .frow .fin{margin-left:auto; text-align:right; flex:none}
  .frow .fin b{display:block; color:var(--green); font-weight:600; font-size:14px}
  .frow .fin span{font-size:11px; color:var(--dim); letter-spacing:.08em}
  .youbadge{display:inline-flex; align-items:center; gap:4px; color:var(--amber); font-size:11px; font-weight:600; letter-spacing:.14em}
  .youbadge svg{width:11px; height:11px}

  /* ===== реплей ===== */
  #replay{position:fixed; inset:0; z-index:100; background:var(--ink); display:none;
    overflow-y:auto; padding:calc(12px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
  #replay.on{display:block; animation:rin var(--t2) var(--ease-out) both}
  @keyframes rin{from{opacity:0; transform:scale(.985)} to{opacity:1; transform:none}}
  #replay .bar{display:flex; align-items:center; justify-content:space-between; max-width:520px; margin:0 auto 6px}
  #replay .bar button{width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--mut)}
  #replay .bar button svg{width:17px; height:17px}
  #replay .inner{max-width:520px; margin:0 auto}
  #rclock{font-size:11.5px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase}
  #rstage{position:relative}
  #rstage.shake{animation:shake .18s linear}
  @keyframes shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
  .verdict{font-family:var(--f-disp); font-weight:900; font-size:29px; letter-spacing:.04em; margin:18px 0 4px;
    animation:pop .5s var(--ease-back) both}
  .verdict.win{color:var(--green)} .verdict.lose{color:var(--red)} .verdict.neutral{color:var(--amber)}
  @keyframes pop{from{opacity:0; transform:scale(.75)} to{opacity:1; transform:none}}
  .r-price{font-family:var(--f-disp); font-weight:700; font-size:17px; color:var(--fg)}
  .r-price b{color:var(--green)}
  .r-sub{font-size:12.5px; color:var(--mut); margin-top:6px}
  .wgrid{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px}
  .wtag{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--hair2); border-radius:8px;
    padding:6px 10px; font-size:12.5px; animation:enter var(--t2) var(--ease-out) both; animation-delay:calc(var(--i)*36ms)}
  .wtag img{width:20px; height:20px}
  .wtag.meish{border-color:var(--amber); color:var(--amber); box-shadow:0 0 14px rgba(255,176,32,.18)}

  /* ===== профиль ===== */
  .idwarn{display:flex; align-items:center; gap:8px; margin:14px 20px 0; padding:9px 11px;
    border:1px solid var(--hair2); border-radius:9px; font-size:12px; color:var(--mut);
    text-align:left; cursor:pointer; transition:border-color var(--t2)}
  .idwarn:active{border-color:var(--amber)}
  .idwarn svg{width:13px; height:13px; color:var(--amber); flex:none}
  .idwarn b{color:var(--amber); white-space:nowrap; margin-left:auto}
  .plinth{position:relative; margin-top:18px; padding:26px 0 20px; text-align:center; overflow:hidden;
    border:1px solid var(--hair); border-radius:14px; background:
    repeating-linear-gradient(0deg, rgba(244,241,232,.016) 0 1px, transparent 1px 4px), var(--ink2)}
  .plinth img{width:108px; height:108px; margin:0 auto; filter:drop-shadow(0 6px 24px rgba(255,176,32,.22));
    animation:hover 4.5s var(--ease-inout) infinite}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .pname{font-family:var(--f-disp); font-weight:900; font-size:23px; margin-top:14px}
  .plvl{margin-top:6px; font-size:11.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--amber); font-weight:600}
  .plvl .crownic{color:var(--amber)}
  .phint{margin-top:4px; font-size:12px; color:var(--dim); font-style:italic}
  .xp{margin:18px 22px 0; text-align:left}
  .xp .lbl{display:flex; justify-content:space-between; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:6px}
  .xpbar{height:5px; background:rgba(244,241,232,.07); border-radius:99px; overflow:hidden}
  .xpbar i{display:block; height:100%; background:var(--amber); width:0; border-radius:99px;
    transition:width 1.1s var(--ease-out) .25s}
  .stats4{display:flex; margin-top:20px; border-top:1px solid var(--hair)}
  .stats4 .st{flex:1; padding:14px 2px 2px; border-left:1px solid var(--hair)}
  .stats4 .st:first-child{border-left:none}
  .stats4 b{display:block; font-family:var(--f-disp); font-weight:900; font-size:24px}
  .stats4 b.grn{color:var(--green)} .stats4 b.red{color:var(--red)} .stats4 b.amb{color:var(--amber)}
  .stats4 span{display:block; margin-top:4px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
  .stats4 .fireic{width:13px; height:13px; vertical-align:-2px; color:var(--amber)}

  .acc{display:flex; align-items:center; gap:14px; margin-top:18px; padding:16px 0; border-top:1px solid var(--hair)}
  .acc .big{font-family:var(--f-disp); font-weight:900; font-size:31px; flex:none}
  .accbars{flex:1}
  .accbars .row{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin:4px 0}
  .accbars .bar{flex:1; height:4px; background:rgba(244,241,232,.07); border-radius:99px; overflow:hidden}
  .accbars .bar i{display:block; height:100%; width:0; transition:width 1s var(--ease-out) .4s}
  .accbars .me i{background:var(--amber)} .accbars .crowd i{background:var(--dim)}
  .accbars .val{width:34px; text-align:right; color:var(--mut)}

  .medals{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px}
  .medal{text-align:center; animation:pop .5s var(--ease-back) both; animation-delay:calc(var(--i)*90ms)}
  .medal .coin{position:relative; width:58px; height:58px; margin:0 auto; overflow:hidden; border-radius:50%}
  .medal .coin img{width:58px; height:58px}
  .medal .coin::after{content:''; position:absolute; top:-20%; bottom:-20%; left:-40%; width:34%;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,.4), transparent);
    transform:skewX(-18deg) translateX(-60px); animation:shine 2.8s var(--ease-inout) infinite; animation-delay:calc(var(--i)*.5s + .8s)}
  @keyframes shine{0%{transform:skewX(-18deg) translateX(-60px)} 18%{transform:skewX(-18deg) translateX(140px)} 100%{transform:skewX(-18deg) translateX(140px)}}
  .medal .cap{margin-top:6px; font-size:11px; letter-spacing:.1em; color:var(--dim)}

  .search{width:100%; background:none; border:none; border-bottom:1px solid var(--hair2); color:var(--fg);
    font-family:var(--f-mono); font-size:16px; padding:11px 2px; outline:none; margin-top:8px;
    transition:border-color var(--t2)}
  .search:focus{border-color:var(--amber)}
  .cand{display:flex; align-items:center; gap:11px; padding:12px 2px; border-bottom:1px solid var(--hair); cursor:pointer; font-size:15px}
  .cand img{width:30px; height:30px}
  .cand .st{margin-left:auto; color:var(--dim); font-size:11.5px; letter-spacing:.1em}

  /* ===== церемония нового звания =====
     стадии: (1) старое существо — лёгкий взлёт и сжатие; (2) вспышка-кольцо + конфетти;
     (3) новое существо — пружинный выход с лучами; (4) каскад титров. */
  #levelup{position:fixed; inset:0; z-index:130; background:var(--ink); display:none;
    flex-direction:column; padding:calc(40px + env(safe-area-inset-top)) 30px calc(28px + env(safe-area-inset-bottom))}
  #levelup.on{display:flex}
  .lu-stage{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden}
  .lu-rays{position:absolute; width:340px; height:340px; border-radius:50%; opacity:0;
    background:repeating-conic-gradient(rgba(255,176,32,.14) 0 9deg, transparent 9deg 24deg);
    -webkit-mask:radial-gradient(circle,#000 18%,transparent 68%); mask:radial-gradient(circle,#000 18%,transparent 68%)}
  #levelup.go .lu-rays{animation:luRaysIn .7s var(--ease-out) .85s both, luSpin 26s linear .85s infinite}
  @keyframes luRaysIn{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)}}
  @keyframes luSpin{to{transform:rotate(360deg)}}
  .lu-old,.lu-new{width:120px; height:120px; position:relative}
  .lu-new{position:absolute; opacity:0}
  #levelup.go .lu-old{animation:luOld .7s var(--ease-inout) .2s both}
  @keyframes luOld{0%{transform:scale(1)} 30%{transform:scale(1.07)} 100%{transform:scale(.45); opacity:0}}
  #levelup.go .lu-new{animation:luNew .6s var(--ease-back) .9s both}
  @keyframes luNew{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:scale(1)}}
  .lu-kicker{margin-top:26px; font-size:11.5px; letter-spacing:.3em; color:var(--dim); text-transform:uppercase; opacity:0}
  .lu-name{font-family:var(--f-disp); font-weight:900; font-size:29px; letter-spacing:.06em; color:var(--amber); margin-top:8px; opacity:0}
  .lu-hint{font-size:12.5px; color:var(--mut); font-style:italic; margin-top:8px; opacity:0}
  #levelup.go .lu-kicker{animation:enter .4s var(--ease-out) 1.3s both}
  #levelup.go .lu-name{animation:pop .5s var(--ease-back) 1.45s both}
  #levelup.go .lu-hint{animation:enter .4s var(--ease-out) 1.7s both}
  #levelup .confetti{position:absolute; inset:0}

  /* onboarding unlock */
  #unlock{position:fixed; inset:0; z-index:120; background:var(--ink); display:none;
    padding:calc(60px + env(safe-area-inset-top)) 30px 40px}
  #unlock.on{display:flex; flex-direction:column}
  #unlock .big{font-family:var(--f-disp); font-weight:900; font-size:25px; animation:pop .5s var(--ease-back) both}
  #unlock .items{margin-top:30px; display:flex; flex-direction:column; gap:22px}
  #unlock .it{display:flex; gap:16px; align-items:flex-start; animation:enter .4s var(--ease-out) both}
  #unlock .it svg{width:22px; height:22px; color:var(--amber); flex:none; margin-top:1px}
  #unlock .it b{display:block; font-size:15px; font-weight:600}
  #unlock .it span{font-size:12.5px; color:var(--mut)}
  #unlock .cta{margin-top:auto}

  /* ===== лига ===== */
  .lgtabs{display:flex; gap:8px}
  .lgt{padding:9px 13px; border:1px solid var(--hair2); border-radius:9px; font-size:11px;
    letter-spacing:.14em; color:var(--dim); text-transform:uppercase; font-weight:600;
    transition:all var(--t2) var(--ease-out)}
  .lgt.on{color:var(--amber); border-color:rgba(255,176,32,.5)}
  .lgt:active{transform:scale(.95)}
  .champline{display:flex; align-items:center; gap:8px; margin-top:14px; padding:11px 13px;
    border:1px solid rgba(255,176,32,.3); border-radius:10px; font-size:12.5px; color:var(--mut);
    background:linear-gradient(90deg, rgba(255,176,32,.06), transparent)}
  .champline svg{width:14px; height:14px; color:var(--amber); flex:none}
  .champline b{color:var(--amber)}
  .ctitle{margin-top:6px; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--amber); opacity:.85}
  .ctitle svg{width:11px; height:11px; vertical-align:-2px}
  .podium{display:flex; align-items:flex-end; gap:10px; margin-top:20px}
  .pod{flex:1; text-align:center; cursor:pointer}
  .pod .beast{position:relative; display:inline-block}
  .pod img{width:48px; height:48px}
  .pod.p1 img{width:60px; height:60px; filter:drop-shadow(0 0 18px rgba(255,176,32,.45))}
  .pod .crown{position:absolute; top:-16px; left:50%; transform:translateX(-50%); width:16px; height:16px; color:var(--amber)}
  .pod .base{margin-top:8px; border:1px solid var(--hair); border-bottom:none; border-radius:8px 8px 0 0;
    background:var(--ink2); padding:8px 4px 10px}
  .pod.p1 .base{border-color:rgba(255,176,32,.35); padding-top:12px; padding-bottom:16px}
  .pod .n{font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pod .s{margin-top:3px; font-size:11px; color:var(--dim); letter-spacing:.08em}
  .lrow{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--hair); cursor:pointer}
  .lrow:last-child{border:none}
  .lrow .pos{width:24px; color:var(--dim); font-size:11.5px; text-align:right; flex:none}
  .lrow img{width:30px; height:30px; flex:none}
  .lrow .nm{font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lrow .nm small{display:block; color:var(--dim); font-weight:500; font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-top:2px}
  .lrow .nm .fireic{width:11px; height:11px; vertical-align:-2px; color:var(--amber)}
  .lrow .sc{margin-left:auto; text-align:right; flex:none}
  .lrow .sc b{font-size:14px; font-weight:600} .lrow .sc span{display:block; color:var(--dim); font-size:11px; letter-spacing:.08em}
  .lrow .duelbtn{flex:none; width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    color:var(--dim); border:1px solid var(--hair); border-radius:8px; transition:all var(--t2)}
  .lrow .duelbtn:active{transform:scale(.9)} .lrow .duelbtn svg{width:15px; height:15px}
  .lrow.meish{background:linear-gradient(90deg, rgba(255,176,32,.06), transparent); margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:8px}

  /* ===== шторка ===== */
  #sheet{position:fixed; inset:0; z-index:90; display:none; align-items:flex-end; background:rgba(4,5,8,.66)}
  #sheet.on{display:flex}
  #sheet .panel{background:var(--ink2); border-top:1px solid var(--hair2);
    border-radius:18px 18px 0 0; width:100%; max-width:520px; margin:0 auto;
    padding:10px 20px calc(20px + env(safe-area-inset-bottom));

const mskYM=d=>new Intl.DateTimeFormat('en-CA',{...MSK,year:'numeric',month:'2-digit'}).format(new Date(d));
function seasonOf(d){ const [y,m]=mskYM(d).split('-').map(Number);
  let idx,yy=y;
  if(m>=3&&m<=5) idx=1; else if(m>=6&&m<=8) idx=2; else if(m>=9&&m<=11) idx=3;
  else { idx=0; if(m===12) yy=y+1; }
  return {key:yy+'-'+idx, idx, year:yy}; }
const skIdx=key=>+key.split('-')[1];
const skYear=key=>+key.split('-')[0];
const seasonNom=key=>SEASONS[skIdx(key)].nom+(skYear(key)!==seasonOf(Date.now()).year?' '+skYear(key):'');

/* Победы сезона считаем по pid: тёзки — разные строки, переименование не рвёт. */
function seasonData(){ const m={};
  for(const c of contests()) if(c.status==='resolved'){
    const k=seasonOf(c.target_time).key; const bucket=m[k]=m[k]||{};
    const wp=c.winner_pids||[];
    (c.winners||[]).forEach((w,i)=>{ const pid=wp[i]!=null?wp[i]:null;
      const key=pid!=null?'p'+pid:'n'+w;
      const e=bucket[key]||(bucket[key]={pid,name:w,wins:0});
      e.wins++; e.name=(pid!=null&&boardByPid(pid)?boardByPid(pid).name:w); }); }
  return m; }
function seasonList(key){ const d=seasonData()[key]||{};
  return Object.values(d).sort((x,y)=>y.wins-x.wins||(x.name>y.name?1:-1)); }
function championsOf(key){ const l=seasonList(key); if(!l.length) return {names:[],wins:0,entries:[]};
  const mx=l[0].wins, top=l.filter(e=>e.wins===mx);
  return {names:top.map(e=>e.name),wins:mx,entries:top}; }
function champTitles(pid,name){ const cur=seasonOf(Date.now()).key;
  return Object.keys(seasonData()).filter(k=>k<cur&&championsOf(k).entries.some(
    e=>pid!=null&&e.pid!=null?e.pid===pid:e.name===name)).sort(); }

/* ============================== лестница ============================== */
function drawLadder(cv,ch,opt={}){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=opt.h||(ch.ranges.length*44+26);
  cv.style.height=H+'px';
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);}
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  const L=4,Rt=W-4,T=6,Bm=H-18, rr=ch.ranges, ser=ch.series||[];
  let lo=Infinity,hi=-Infinity;
  for(const[,p]of ser){lo=Math.min(lo,p);hi=Math.max(hi,p);}
  for(const[a,b]of rr){ if(a!=null){lo=Math.min(lo,a);hi=Math.max(hi,a);} if(b!=null){lo=Math.min(lo,b);hi=Math.max(hi,b);} }
  if(!isFinite(lo)){lo=0;hi=1;}
  const pad=(hi-lo)*.04||1; lo-=pad; hi+=pad;
  const py=p=>Bm-(p-lo)/(hi-lo)*(Bm-T);
  const t0=+new Date(ch.posted), t1=+new Date(ch.target);
  const px=t=>L+(t-t0)/(t1-t0)*(Rt-L);
  const n=Math.max(1,Math.round((opt.progress==null?1:opt.progress)*ser.length));
  const cur=ser[Math.min(n,ser.length)-1];
  const curZone=cur?zoneOf(rr,cur[1]):-1;
  const maxV=opt.votes?Math.max(1,...opt.votes):1;

  /* зоны: заливки-подсветки */
  for(let i=0;i<rr.length;i++){
    const[a,b]=rr[i], y1=py(b==null?hi:b), y2=py(a==null?lo:a);
    if(i===opt.winnerZone){ x.fillStyle='rgba(44,224,139,.10)'; x.fillRect(L,y1,Rt-L,y2-y1); }
    else if(i===curZone&&opt.live){ x.fillStyle='rgba(255,176,32,.05)'; x.fillRect(L,y1,Rt-L,y2-y1); }
    if(i===opt.myZone){ x.fillStyle='rgba(255,176,32,.045)'; x.fillRect(L,y1,Rt-L,y2-y1);
      x.fillStyle='#FFB020'; x.fillRect(L,y1,2,y2-y1); }
  }
  /* дни недели */
  x.font='500 10px "IBM Plex Mono",monospace'; x.textAlign='center'; x.textBaseline='alphabetic';
  for(let t=Math.ceil(t0/864e5)*864e5;t<t1;t+=864e5){
    const xx=px(t); if(xx<L+16||xx>Rt-16) continue;
    x.fillStyle='rgba(86,93,110,.9)';
    x.fillText(new Intl.DateTimeFormat('ru-RU',{...MSK,weekday:'short'}).format(new Date(t)).toUpperCase(),xx,H-6);
  }
  x.textAlign='left';
  /* границы зон + подписи */
  for(let i=0;i<rr.length;i++){
    const[a,b]=rr[i], y1=py(b==null?hi:b), y2=py(a==null?lo:a), ym=(y1+y2)/2;
    x.strokeStyle='rgba(244,241,232,.07)'; x.lineWidth=1;
    x.beginPath(); x.moveTo(L,y2+.5); x.lineTo(Rt,y2+.5); x.stroke();
    const lab=zoneShort(rr,i,ch.symbol);
    x.font='600 11px "IBM Plex Mono",monospace'; x.textBaseline='middle';
    x.fillStyle= i===opt.winnerZone?'#2CE08B': (i===curZone&&opt.live)?'#FFB020': i===opt.myZone?'rgba(255,176,32,.85)':'rgba(139,147,167,.55)';
    x.fillText(lab,L+7,ym);
    if(i===opt.myZone){ x.font='600 9.5px "IBM Plex Mono",monospace';
      x.fillText('ТЫ',L+7+x.measureText(lab).width+18,ym); x.font='600 11px "IBM Plex Mono",monospace'; }
    if(opt.votes&&opt.votes[i]>0){
      const w=8+40*(opt.votes[i]/maxV), bx=Rt-8-w;
      x.fillStyle= i===opt.winnerZone?'rgba(44,224,139,.7)':'rgba(139,147,167,.35)';
      x.fillRect(bx,ym-1.5,w,3);
      x.fillStyle='rgba(139,147,167,.8)'; x.font='500 10.5px "IBM Plex Mono",monospace';
      x.textAlign='right'; x.fillText(opt.votes[i],bx-5,ym); x.textAlign='left';
    }
  }
  /* дедлайн */
  if(opt.deadline){ const dx=px(+new Date(opt.deadline));
    if(dx>L&&dx<Rt){ x.fillStyle='rgba(255,82,82,.8)'; x.fillRect(dx-1,Bm-6,2,6); } }
  /* линия цены */
  if(n>1){ x.strokeStyle='rgba(255,176,32,.9)'; x.lineWidth=1.6; x.lineJoin='round';
    x.save(); x.shadowColor='rgba(255,176,32,.35)'; x.shadowBlur=6; x.beginPath();
    for(let i=0;i<n;i++){const[t,p]=ser[i]; const X=px(t),Y=py(p); i?x.lineTo(X,Y):x.moveTo(X,Y);}
    x.stroke(); x.restore(); }
  /* комета */
  if(cur){ const X=px(cur[0]),Y=py(cur[1]);
    const pulse=opt.live?(0.7+0.3*Math.sin(Date.now()/420)):1;
    x.save(); x.shadowColor='rgba(255,176,32,.9)'; x.shadowBlur=12*pulse;
    x.fillStyle='#FFB020'; x.fillRect(X-3,Y-3,6,6); x.restore();
    x.fillStyle='#F2EFE6'; x.fillRect(X-1,Y-1,2,2);
  }
  /* точка финиша */
  if(opt.winnerPrice!=null&&(opt.progress==null||opt.progress>=1)){
    const Y=py(opt.winnerPrice);
    x.save(); x.shadowColor='rgba(44,224,139,.95)'; x.shadowBlur=14;
    x.fillStyle='#2CE08B'; x.fillRect(Rt-8,Y-4,8,8); x.restore();
  }
  return {cur,curZone,py,px,lo,hi,T,Bm,L,Rt};
}
/* конфетти направленным веером из точки */
function confettiBurst(cv,fx,fy,dur=2200){
  if(reduced()) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#FFB020','#2CE08B','#F7D96B','#F2EFE6'];
  const ps=Array.from({length:90},()=>{ const a=Math.PI*(0.75+Math.random()*0.85); const v=2+Math.random()*4.5;
    return {x:fx,y:fy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.2,s:2+Math.random()*3,
      c:cols[Math.random()*cols.length|0]}; });
  const t0=performance.now();
  (function f(t){ const k=(t-t0)/dur; x.clearRect(0,0,W,H); if(k>1) return;
    for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.vy+=.09;
      x.globalAlpha=Math.max(0,1-k*1.15); x.fillStyle=p.c; x.fillRect(p.x,p.y,p.s,p.s); }
    x.globalAlpha=1; requestAnimationFrame(f); })(t0);
}
function flashRing(cv,fx,fy){
  if(reduced()) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth,H=cv.clientHeight;
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const t0=performance.now();
  (function f(t){ const k=(t-t0)/380; if(k>1) return;
    x.strokeStyle=`rgba(242,239,230,${(1-k)*.8})`; x.lineWidth=2.5-k*2;

    requestAnimationFrame(f); })(t0);
}

let RP={raf:0,skip:false};
function timeRemap(u){ // фазы: разгон → полёт → слоу-мо у финиша
  if(u<.1){ const k=u/.1; return .06*k*k; }
  if(u<.75){ return .06+.82*((u-.1)/.65); }
  const k=(u-.75)/.25; return .88+.12*(1-Math.pow(1-k,3));
}
function openReplay(id){
  const c=contests().find(x=>chartIdOf(x)===id); const ch=S.charts[id];
  if(!c||!ch) return;
  RP={raf:0,skip:false,c,ch,id};
  $('#replay').classList.add('on'); tgBack(); $('#resheet').innerHTML='';
  document.body.style.overflow='hidden';
  if(reduced()){ finishReplay(true); return; }
  const cv=$('#rcanvas'), DUR=6000; let t0=0,lastZone=-1;
  const step=t=>{ if(!$('#replay').classList.contains('on')) return;
    if(!t0) t0=t;
    let u=Math.min(1,(t-t0)/DUR); if(RP.skip) u=1;
    const p=timeRemap(u);
    const info=drawLadder(cv,ch,{progress:p,votes:c.votes,myZone:S.bets[id],
      deadline:c.deadline,h:Math.min(innerHeight*.56,520)});
    if(info.cur){ $('#rclock').textContent=fmtDT(info.cur[0]);
      if(info.curZone!==lastZone&&lastZone!==-1) sTick(); lastZone=info.curZone; }
    if(u<1) RP.raf=requestAnimationFrame(step); else finishReplay();
  };
  RP.raf=requestAnimationFrame(step);
  $('#skipbtn').onclick=()=>{RP.skip=true};
}
function finishReplay(instant){
  const {c,ch,id}=RP;
  const H=Math.min(innerHeight*.56,520);
  const info=drawLadder($('#rcanvas'),ch,{progress:1,votes:c.votes,myZone:S.bets[id],
    deadline:c.deadline,winnerZone:c.winner_option,winnerPrice:c.winner_price,h:H});
  $('#rclock').textContent='ФИНИШ · '+fmtDT(c.target_time);
  const mr=meRow(); const meWon=!!mr&&wonBy(c,mr.pid,mr.name);
  const betWon=S.bets[id]!=null&&S.bets[id]===c.winner_option;
  if(!instant){
    const fx=info.Rt-4, fy=info.py(c.winner_price);
    const rc=$('#rconfetti'); rc.style.height=H+'px';
    flashRing(rc,fx,fy); confettiBurst(rc,fx,fy);
    $('#rstage').classList.remove('shake'); void $('#rstage').offsetWidth; $('#rstage').classList.add('shake');
    (meWon||betWon)?sWin():sThud();
  }
  const verdict= meWon?'В ЯБЛОЧКО':betWon?'МЕТКА СЫГРАЛА':'ФИНИШ';
  const vcls= (meWon||betWon)?'win':'neutral';
  const wn=c.winners||[];
  $('#resheet').innerHTML=`
    <div class="verdict ${vcls}">${verdict}</div>
    <div class="r-price">${esc(symName(ch.symbol))} → <b id="rpricev">${fmtP(c.winner_price)}</b> · зона ${zoneShort(ch.ranges,c.winner_option)}</div>
    ${S.bets[id]!=null&&!betWon?`<div class="r-sub">твоя метка ${zoneShort(ch.ranges,S.bets[id])} — мимо. В среду отыграемся.</div>`:''}
    ${wn.length?`<div class="k" style="margin-top:16px">угадали ${wn.length}</div>
      <div class="wgrid">${wn.map((w,i)=>`<span class="wtag ${isWinnerMe(c,i)?'meish':''}" style="--i:${i}" ${winnerPid(c,i)!=null?`onclick="openPlayerPid(${winnerPid(c,i)})"`:''}>${beastImg(lvlOfWinner(c,i,w),20)} ${esc(winnerName(c,i,w))}</span>`).join('')}</div>`
      :'<div class="r-sub" style="margin-top:14px">не угадал никто — рынок победил всех</div>'}
    <button class="cta ghost" style="margin-top:20px" onclick="closeReplay()">закрыть</button>`;
  const pv=$('#rpricev'); if(!instant&&pv) countTo(pv,c.winner_price,{fmt:v=>fmtP(v),from:c.winner_price*.97,dur:700});
}

        <div class="pos">${i+1}</div>${beastImg(lv,30)}
        <div class="nm">${esc(e.name)}<small>ур.${lv.n} ${lv.name}</small></div>
        <div class="sc"><b>${e.wins}</b><span>побед</span></div>
        ${meRow()&&!isMeRow(row)&&idx>=0?`<button class="duelbtn" data-dueli="${idx}">${icon('sword')}</button>`:''}</div>`;}).join('')}</div>
      <div class="undernote" style="margin-top:12px">Сезон — как время года: ${SEASONS[skIdx(cur)].nom} длится ${SEASONS[skIdx(cur)].range}. ${SEASONS[skIdx(cur)].ends} лучший получит титул «Оракул ${seasonGen(cur)}» — корону на карточку навсегда.</div>`
      :`<div class="undernote" style="margin-top:16px">${SEASONS[skIdx(cur)].instr[0].toUpperCase()+SEASONS[skIdx(cur)].instr.slice(1)} побед ещё нет — всё решится в среду.</div>`;
  } else {
    const top=b.slice(0,3);
    if(top.length===3){
      const P=(i,cls)=>{ const lv=levelOf(top[i]);
        return `<div class="pod ${cls}" onclick="openPlayerIdx(${i})">
        <span class="beast">${cls==='p1'?`<span class="crown">${icon('crown')}</span>`:''}${beastImg(lv,cls==='p1'?66:48)}</span>
        <div class="base"><div class="n">${esc(top[i].name)}</div>
        <div class="s">${top[i].wins}/${top[i].games}${top[i].streak>=2?' · серия '+top[i].streak:''}</div></div></div>`;};
      html+=`<div class="podium">${P(1,'p2')}${P(0,'p1')}${P(2,'p3')}</div>`;
    }
    html+=`<input class="search" id="lsearch" placeholder="найти игрока…" autocomplete="off"><div id="lrows"></div>`;
  }
  v.innerHTML=html;
  $$('.lgt',v).forEach(el=>el.onclick=()=>{ S.lgMode=el.dataset.m; renderLeague(); applyStagger(v); });

  const bindRows=()=>{ $$('#lrows .lrow').forEach(el=>el.onclick=()=>{
      if(el.dataset.i!=null) openPlayerIdx(+el.dataset.i); else openPlayer(el.dataset.n); });
    $$('#lrows .duelbtn').forEach(el=>el.onclick=e=>{e.stopPropagation();
      duel(el.dataset.dueli!=null?+el.dataset.dueli:el.dataset.duel);}); };
  if(S.lgMode!=='season'){
    const rows=q=>{ const qq=(q||'').trim().toLowerCase();
      const list=qq?b.filter(x=>x.name.toLowerCase().includes(qq)):b;
      $('#lrows').innerHTML=list.map(x=>{ const i=b.indexOf(x), lv=levelOf(x);
        return `<div class="lrow ${isMeRow(x)?'meish':''}" data-i="${i}">
          <div class="pos">${i+1}</div>${beastImg(lv,30)}
          <div class="nm">${esc(x.name)}<small>ур.${lv.n} ${lv.name}${x.streak>=2?' · '+icon('fire','width:11px;height:11px;vertical-align:-2px')+x.streak:''}</small></div>
          <div class="sc"><b>${x.wins}/${x.games}</b><span>${Math.round(x.win_pct)}%</span></div>
          ${meRow()&&!isMeRow(x)?`<button class="duelbtn" data-dueli="${i}">${icon('sword')}</button>`:''}</div>`;}).join('');
      bindRows(); };
    $('#lsearch').oninput=e=>rows(e.target.value); rows('');
  } else bindRows();
}
/* игрок: клик по имени. Имена в winners не уникальны (user_id наружу не отдаём),
   поэтому: одно совпадение — карточка; тёзки — выбор; нет в лиге — мини-карточка. */
function openPlayer(name){
  const bl=S.preds.board||[];
  const matches=bl.map((x,i)=>[x,i]).filter(([x])=>x.name===name);
  if(matches.length===1) return openPlayerIdx(matches[0][1]);
  if(matches.length>1){
    $('#sheetbody').innerHTML=`<div class="sh-title">${esc(name)} — тёзки</div>
      <div class="k" style="margin-bottom:4px">в лиге ${matches.length} игрока с этим именем — выбери</div>
      ${matches.map(([x,i])=>`<div class="cand" data-i="${i}">${beastImg(levelOf(x),30)} ${esc(x.name)}
        <span class="st">${x.wins}/${x.games} · №${i+1}</span></div>`).join('')}
      <div class="k" style="margin-top:10px">в сезонной таблице их победы складываются — по имени их не различить</div>`;
    showSheet();
    $$('#sheetbody .cand').forEach(el=>el.onclick=()=>openPlayerIdx(+el.dataset.i));
    return;
  }
  let pid=null;
  for(const c of contests()){ const i=(c.winners||[]).indexOf(name);
    if(i>=0&&winnerPid(c,i)!=null){ pid=winnerPid(c,i); break; } }
  if(pid!=null&&boardByPid(pid)) return openPlayerPid(pid);
  const wins=winsOf(pid,name);
  $('#sheetbody').innerHTML=`<div style="text-align:center;padding-top:8px">
    <div style="display:flex;justify-content:center">${beastImg({n:1,spr:'plankton'},72)}</div>
    <div class="sh-title" style="margin-top:10px">${esc(name)}</div>
    <div class="k" style="margin-top:6px">угадал ${wins.length} — в таблице лиги пока не числится</div>
    ${wins.length?`<div class="undernote" style="margin-top:12px;text-align:left">золото: ${wins.map(c=>esc(symName(S.charts[chartIdOf(c)]?.symbol))+' '+fmtD(c.target_time)).join(' · ')}</div>`:''}
  </div>`;
  showSheet();
}
function openPlayerPid(pid){ const i=(S.preds.board||[]).findIndex(b=>b.pid===pid);
  if(i>=0) openPlayerIdx(i); }
function openPlayerIdx(idx){
  const b=(S.preds.board||[])[idx]; if(!b) return;
  const name=b.name, lv=levelOf(b), pos=idx+1;
  const wins=winsOf(b.pid,name);
  $('#sheetbody').innerHTML=`<div style="text-align:center;padding-top:8px">
    <div style="display:flex;justify-content:center">${beastImg(lv,72)}</div>
    <div class="sh-title" style="margin-top:10px">${esc(name)}</div>
    <div class="plvl">ур.${lv.n} · ${lv.name} · №${pos}</div>
    ${champTitles(b.pid,name).length?`<div class="ctitle">${icon('crown')} ${champTitles(b.pid,name).map(k=>'оракул '+seasonGen(k)).join(' · ')}</div>`:''}
    <div class="stats4" style="margin-top:14px">
      <div class="st"><b class="grn">${b.wins}</b><span>побед</span></div>
      <div class="st"><b class="red">${Math.max(0,b.games-b.wins)}</b><span>промахов</span></div>
      <div class="st"><b class="amb">${b.streak}</b><span>серия</span></div>
      <div class="st"><b>${Math.round(b.win_pct)}%</b><span>точность</span></div>
    </div>
    ${wins.length?`<div class="undernote" style="margin-top:12px;text-align:left">золото: ${wins.map(c=>esc(symName(S.charts[chartIdOf(c)]?.symbol))+' '+fmtD(c.target_time)).join(' · ')}</div>`:''}
    ${meRow()&&!isMeRow(b)?`<button class="cta" style="margin-top:16px" onclick="duel(${idx})">${icon('sword')} Дуэль</button>`:''}
  </div>`;
  showSheet();
}
function duel(ref){
  const a=meRow();
  const b=typeof ref==='number'?(S.preds.board||[])[ref]:boardOf(ref);
  if(!a||!b) return;
  const name=b.name;
  const la=levelOf(a), lb=levelOf(b);
  const row=(lbl,va,vb,fmt=x=>x)=>{ const t=va+vb||1;
    return `<div class="dstat"><div class="lbl"><b>${fmt(va)}</b><span>${lbl}</span><b>${fmt(vb)}</b></div>
    <div class="dbar"><i class="l" data-w="${Math.round(100*va/t)}"></i><i class="r" data-w="${Math.round(100*vb/t)}"></i></div></div>`;};
  const verdict= a.score===b.score?'ничья — рынок рассудит':(a.score>b.score?esc(a.name)+' точнее — пока':esc(name)+' точнее — пока');
  $('#sheetbody').innerHTML=`<div class="duel">
      <div class="side">${beastImg(la,58)}<div class="n">${esc(a.name)}</div></div>
      <div class="vs">VS</div>
      <div class="side">${beastImg(lb,58)}<div class="n">${esc(name)}</div></div>
    </div>
    ${row('рейтинг лиги',Math.round(a.score*1000)/10,Math.round(b.score*1000)/10,x=>x+'%')}
    ${row('точность',Math.round(a.win_pct),Math.round(b.win_pct),x=>x+'%')}
    ${row('побед',a.wins,b.wins)}
    ${row('серия сейчас',a.streak,b.streak)}
    ${row('рекорд серии',a.best_streak,b.best_streak)}
    ${row('сыграно',a.games,b.games)}
    <div class="dverdict">${verdict}</div>
    <div class="k" style="text-align:center;margin-top:6px">вердикт — по рейтингу лиги · серия побед на него не влияет</div>
    <button class="cta ghost" style="margin-top:16px" onclick="closeSheet()">закрыть</button>`;
  showSheet();
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$('#sheetbody .dbar i').forEach(i=>i.style.width=i.dataset.w+'%')));
  sTick();
}
function closeSheet(){ $('#sheet').classList.remove('on'); tgBack(); }

/* ============================== каркас ============================== */
function applyStagger(sec){
  [...sec.children].forEach((el,i)=>{ el.classList.remove('stagitem'); void el.offsetWidth;
    el.style.setProperty('--i',Math.min(i,10)); el.classList.add('stagitem'); });
}
function switchTab(t){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $$('main section').forEach(s=>s.classList.remove('on'));
  const sec=$('#v-'+t); sec.classList.add('on');
  sTick();
  if(t!=='live') clearInterval(S.liveTimer); else renderLive();
  applyStagger(sec);
}
$$('#tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.t));
$('#sndbtn').onclick=()=>{ S.sound=!S.sound; localStorage.setItem('oracle_sound',S.sound?'1':'');
  $('#sndbtn').classList.toggle('on',S.sound); if(S.sound){ac(); sTick();} };

function renderAll(){
  renderLive(); renderFin(); renderMe(); renderLeague();
  maybeLevelUp();
  const mt=$('#metab');
  const mr=meRow();
  if(mr){ const lv=levelOf(mr);
    mt.innerHTML=`${beastImg(lv,24)}Я`; }
  else mt.innerHTML=`<svg class="px" viewBox="0 0 24 24"></svg>Я<span class="dot"></span>`,
    setIcon(mt.querySelector('svg'),'user');
}
(async function init(){
  tgInit();
  /* Личность: pid выдаёт бот (он проверил telegram-айди) — через #pid=N в адресе
     кнопки или startapp. Один раз запомнили — дальше узнаём сами. */
  const urlPid=readPid();
  if(urlPid!=null){ S.pid=urlPid; S.verified=true;          // выдал бот — Telegram подтвердил, кто это
    localStorage.setItem('oracle_pid',String(urlPid)); localStorage.setItem('oracle_verified','1');
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  else { const st=+localStorage.getItem('oracle_pid'); if(st){ S.pid=st;
    S.verified=localStorage.getItem('oracle_verified')==='1'; } }
  S.me=localStorage.getItem('oracle_me')||null;
  try{ S.bets=JSON.parse(localStorage.getItem('oracle_bets')||'{}'); }catch(e){ S.bets={}; }
  S.sound=!!localStorage.getItem('oracle_sound');
  $('#sndbtn').classList.toggle('on',S.sound); setIcon($('#sndico'),'volume');
  try{ await loadData(); }catch(e){
    $('#v-live').innerHTML=`<div class="err">Не удалось загрузить predictions.json / pred_charts.json.<br>Открой страницу через сервер сайта, не как файл.</div>`;
    return;
  }
  tgAutoLogin();
  const mr0=meRow(); if(mr0&&mr0.name!==S.me){ S.me=mr0.name; localStorage.setItem('oracle_me',S.me); }
  renderAll();
  applyStagger($('#v-live'));
  setInterval(async()=>{ try{ await loadData(); renderAll(); }catch(e){} },3e5);
  document.addEventListener('visibilitychange',async()=>{ if(!document.hidden){
    try{ await loadData(); renderAll(); }catch(e){} maybeAskMark(); } });
  addEventListener('resize',()=>{ if($('#v-live').classList.contains('on')) renderLive(); });
  /* переход по ссылке бота при уже открытой странице (смена #pid не перезагружает) */
  addEventListener('hashchange',()=>{ const p=readPid();
    if(p!=null&&p!==S.pid){ S.pid=p; S.verified=true;
      localStorage.setItem('oracle_pid',String(p)); localStorage.setItem('oracle_verified','1');
      const r=meRow(); if(r){ S.me=r.name; localStorage.setItem('oracle_me',S.me); }
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
      renderAll(); switchTab('me'); } });
})();
</script>
